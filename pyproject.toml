[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "job-processor-service"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "alembic==1.15.2",
  "fastapi==0.115.10",
  "sqlalchemy==2.0.38",
  "pydantic-settings==2.8.1",
  "psycopg[binary]==3.2.6",
  "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
  "ruff==0.11.0",
  "black==25.1.0",
  "mypy==1.15.0",
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
  "bandit==1.8.3",
  "httpx==0.28.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term --cov-fail-under=90"
testpaths = ["tests"]

[tool.bandit]
exclude_dirs = ["tests"]
