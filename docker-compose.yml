services:
  postgres:
    image: postgres:16
    container_name: job-processor-postgres
    environment:
      POSTGRES_DB: job_processor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "${JOB_PROCESSOR_DB_PORT:-5433}:5432"
    volumes:
      - job_processor_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_processor"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  job_processor_pgdata:
