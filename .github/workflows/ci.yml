name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  lint_type_test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/job_processor
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: job_processor
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'

      - name: Check Python version
        run: |
          python -c "import sys; raise SystemExit(0 if (sys.version_info.major, sys.version_info.minor)==(3,12) else 1)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Ruff
        run: python -m ruff check .

      - name: Black
        run: python -m black --check .

      - name: MyPy
        run: python -m mypy src

      - name: Wait for PostgreSQL
        run: |
          python - <<'PY'
          import time
          import psycopg

          dsn = "postgresql://postgres:postgres@localhost:5432/job_processor"
          last_error = None

          for _ in range(30):
              try:
                  with psycopg.connect(dsn, connect_timeout=2):
                      print("PostgreSQL is ready")
                      raise SystemExit(0)
              except Exception as error:
                  last_error = error
                  time.sleep(1)

          raise SystemExit(f"PostgreSQL not ready: {last_error}")
          PY

      - name: Pytest with coverage gate
        run: python -m pytest --cov=src --cov-report=term --cov-fail-under=80

  security_scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.0'

      - name: Check Python version
        run: |
          python -c "import sys; raise SystemExit(0 if (sys.version_info.major, sys.version_info.minor)==(3,12) else 1)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Install trufflehog CLI
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.90.5/trufflehog_3.90.5_linux_amd64.tar.gz -o trufflehog.tar.gz
          tar -xzf trufflehog.tar.gz trufflehog
          sudo mv trufflehog /usr/local/bin/trufflehog

      - name: Bandit (high severity only)
        run: python -m bandit -r src -x tests -lll -q

      - name: TruffleHog
        run: trufflehog filesystem . --no-update --fail
